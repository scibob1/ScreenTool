name: Build APK

# 日常构建：推送到主分支、PR、手动触发时只编译并上传 APK 文件（不发布 Release）。
# 发布 Release 见 release.yml（打 v* 标签，或在 Actions 页面手动运行）。
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # CI 构建只用仓库自带的公开密钥，保证 fork 和 PR 也能编译；正式发布的签名在 release.yml 里处理
      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "ScreenTool-ci-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTool-apk
          path: ScreenTool-ci-*.apk
