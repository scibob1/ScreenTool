name: Release APK

on:
  push:
    tags: [ 'v*', '[0-9]*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.5.3), will be created if missing'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # 仓库变量 REQUIRE_PRIVATE_KEY=true 时，缺少私钥 Secrets 就直接失败（不退回仓库里的公开密钥）
      REQUIRE_PRIVATE_KEY: ${{ vars.REQUIRE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 配了 4 个 Secrets 就用私钥签名；没配就明确提示并退回仓库自带的公开密钥（仅自用，见 docs/SIGNING.md）。
      # 注意：不同密钥签的包不能互相覆盖安装，发布过一次之后请固定用同一把。
      - name: Decode signing key (optional)
        env:
          STORE_B64: ${{ secrets.SIGN_STORE_BASE64 }}
          STORE_PW: ${{ secrets.SIGN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          KEY_PW: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          missing=""
          for v in STORE_B64 STORE_PW KEY_ALIAS KEY_PW; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            if [ "$REQUIRE_PRIVATE_KEY" = "true" ]; then
              echo "::error::Missing secrets:$missing (SIGN_STORE_BASE64 / SIGN_STORE_PASSWORD / SIGN_KEY_ALIAS / SIGN_KEY_PASSWORD)"
              exit 1
            fi
            echo "::warning::No complete private signing key in Secrets (missing:$missing). Using the bundled PUBLIC keystore - fine for personal use, not for wide distribution."
            echo "SIGNING_KIND=public key (bundled)" >> "$GITHUB_ENV"
          else
            KS="$RUNNER_TEMP/release.keystore"
            echo "$STORE_B64" | base64 -d > "$KS"
            echo "SIGN_STORE_FILE=$KS" >> "$GITHUB_ENV"
            echo "SIGN_STORE_PASSWORD=$STORE_PW" >> "$GITHUB_ENV"
            echo "SIGN_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"
            echo "SIGNING_KIND=private key (Secrets)" >> "$GITHUB_ENV"
          fi

      # 混淆/资源压缩已在 app/build.gradle 里关闭（minifyEnabled false / shrinkResources false）
      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "ScreenTool-${TAG}.apk"

      # 从 CHANGELOG.md 里取出这个版本的那一段作为发布说明（找不到就只用自动生成的）
      - name: Extract release notes
        run: |
          VER="${TAG#v}"
          awk -v ver="$VER" '
            $0 ~ "^## " ver "([ ]|$)" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release_notes.md
          {
            echo
            echo "---"
            echo "Signed with: ${SIGNING_KIND}"
          } >> release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ScreenTool ${{ env.TAG }}
          body_path: release_notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ScreenTool-${{ env.TAG }}.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
